<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">

<title>WARICAN</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0f172a;
  --card: rgba(255,255,255,.08);
  --border: rgba(255,255,255,.12);
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 15% 20%, rgba(56,189,248,.15), transparent 30%),
    radial-gradient(circle at 85% 80%, rgba(99,102,241,.18), transparent 30%),
    var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
}

.app {
  width: min(1050px, 100%);
}

header {
  margin-bottom: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 48px;
  height: 48px;
  border-radius: 15px;
  display: block;
  object-fit: cover;
}

.brand-text h1 {
  margin: 0;
  font-size: 26px;
  letter-spacing: .08em;
}

.brand-text p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.main-card {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 20px;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 30px;
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow:
    0 30px 80px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.05);
}

.input-panel {
  padding: 18px;
}

.section-title {
  margin: 0 0 20px;
  font-size: 14px;
  font-weight: 800;
  color: #cbd5e1;
}

.field {
  margin-bottom: 20px;
}

.field label {
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}

.input-box {
  position: relative;
}

.integer-input {
  width: 100%;
  height: 68px;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 17px;
  outline: none;
  padding: 0 65px 0 18px;
  background: rgba(255,255,255,.96);
  color: #111827;
  font-size: 27px;
  font-weight: 800;
  transition: .2s;
}

.integer-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(56,189,248,.12);
}

.unit {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: #64748b;
  font-size: 15px;
  font-weight: 800;
}

/* OCR */

#receiptInput {
  display: none;
}

.ocr-button {
  width: 100%;
  height: 56px;
  margin-top: -5px;
  margin-bottom: 22px;
  border: 0;
  border-radius: 16px;
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  color: white;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(56,189,248,.15);
  transition: .2s;
}

.ocr-button:hover {
  transform: translateY(-1px);
}

.ocr-button:active {
  transform: scale(.98);
}

.ocr-button:disabled {
  opacity: .55;
  cursor: wait;
  transform: none;
}

.ocr-status {
  display: none;
  margin: -10px 0 20px;
  padding: 12px 15px;
  border-radius: 13px;
  background: rgba(255,255,255,.06);
  color: #cbd5e1;
  font-size: 12px;
  text-align: center;
}

.ocr-status.show {
  display: block;
}

.ocr-status.error {
  color: #fca5a5;
}

.ocr-status.success {
  color: #86efac;
}

/* 端数 */

.rounding {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.rounding input {
  display: none;
}

.rounding label {
  height: 50px;
  margin: 0;
  border-radius: 13px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.05);
  color: #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 12px;
  font-weight: 800;
  transition: .2s;
}

.rounding label:hover {
  background: rgba(255,255,255,.1);
}

.rounding input:checked + label {
  background: #f8fafc;
  color: #0f172a;
  border-color: #f8fafc;
}

/* 結果 */

.result-panel {
  min-height: 450px;
  border-radius: 24px;
  padding: 34px;
  background: linear-gradient(145deg, #f8fafc, #e2e8f0);
  color: #0f172a;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  box-shadow:
    0 20px 50px rgba(0,0,0,.15),
    inset 0 1px rgba(255,255,255,.8);
}

.result-label {
  color: #64748b;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .15em;
}

.result-number {
  margin: 12px 0 4px;
  font-size: clamp(65px, 8vw, 105px);
  line-height: .95;
  font-weight: 900;
  letter-spacing: -.06em;
}

.result-number .yen {
  margin-left: 7px;
  font-size: .32em;
  letter-spacing: 0;
}

.result-info {
  margin-top: 20px;
  color: #64748b;
  font-size: 13px;
}

.result-info strong {
  color: #334155;
}

.difference {
  margin: 22px auto 0;
  padding: 9px 15px;
  border-radius: 100px;
  background: #e2e8f0;
  color: #64748b;
  font-size: 12px;
  font-weight: 700;
}

/* レシート画像付き共有 */

.share {
  width: 100%;
  margin-top: 18px;
  background: linear-gradient(135deg, #0ea5e9, #4f46e5);
  color: white;
  box-shadow: 0 10px 22px rgba(79,70,229,.18);
}

.share:disabled {
  cursor: not-allowed;
  opacity: .5;
  transform: none;
}

.sheet,
.image-lightbox {
  display: none;
  position: fixed;
  z-index: 10;
  inset: 0;
}

.sheet {
  align-items: center;
  justify-content: center;
  background: rgba(15,23,42,.58);
}

.sheet.show,
.image-lightbox.show {
  display: flex;
}

.sheet-body {
  width: min(560px, 100%);
  max-height: 92vh;
  overflow-y: auto;
  padding: 25px 22px 27px;
  border-radius: 24px;
  background: #fff;
  color: #0f172a;
  box-shadow: 0 -8px 28px rgba(0,0,0,.16);
}

.sheet-body h2 {
  margin: 0 0 14px;
  color: #0f172a;
  font-size: 21px;
  text-align: center;
}

.receipt-preview {
  display: block;
  width: min(280px, 76vw);
  height: auto;
  max-height: none;
  margin: 0 auto 14px;
  padding: 0;
  overflow: visible;
  appearance: none;
  border: 1px solid #dbe8f3;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(48,44,37,.15);
  cursor: zoom-in;
}

.receipt-preview[hidden] {
  display: none;
}

.receipt-preview img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.share-notice {
  margin: 14px 0;
  padding: 12px 14px;
  border-radius: 11px;
  background: #fff5df;
  color: #875800;
  font-size: 13px;
  line-height: 1.5;
}

.sheet-actions {
  display: flex;
  gap: 10px;
}

.close-sheet,
.open-share {
  flex: 1;
}

.close-sheet {
  background: #eef2f6;
  color: #40556c;
}

.open-share {
  background: #0ea5e9;
  color: white;
}

.share-action-status {
  min-height: 1.4em;
  margin: 12px 0 0;
  color: #64748b;
  font-size: 12px;
  text-align: center;
}

.ocr-confirm-preview {
  width: min(220px, 64vw);
  max-height: 32vh;
}

.ocr-confirm-preview img {
  max-height: 32vh;
}

.ocr-confirm-label {
  margin: 12px 0 4px;
  color: #52677e;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
}

.ocr-confirm-amount {
  margin: 0 0 16px;
  color: #0f355d;
  font-size: clamp(38px, 11vw, 58px);
  font-weight: 800;
  line-height: 1.1;
  text-align: center;
}

.ocr-confirm-notice {
  margin: 0 0 16px;
  color: #52677e;
  font-size: 14px;
  line-height: 1.6;
  text-align: center;
}

.image-lightbox {
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(8,20,34,.82);
}

.image-lightbox img {
  max-width: 88vw;
  max-height: 78vh;
  object-fit: contain;
}

.lightbox-close {
  position: absolute;
  top: 18px;
  right: 18px;
  height: auto;
  min-height: 44px;
  padding: 0 15px;
  border-radius: 11px;
  background: white;
  color: #1d354d;
}

/* ボタン */

.buttons {
  display: flex;
  gap: 8px;
  margin-top: 22px;
}

button {
  height: 50px;
  border: 0;
  border-radius: 14px;
  cursor: pointer;
  font-weight: 800;
  transition: .2s;
}

.reset {
  flex: 1;
  color: #cbd5e1;
  background: rgba(255,255,255,.06);
}

.copy {
  flex: 1.5;
  color: #0f172a;
  background: #f8fafc;
}

button:hover {
  transform: translateY(-1px);
}

button:active {
  transform: scale(.98);
}

.copied {
  background: #bbf7d0 !important;
}

footer {
  text-align: center;
  margin-top: 15px;
  color: #64748b;
  font-size: 11px;
}

.app-version {
  margin-top: 3px;
}

/* タブレット */

@media (max-width: 760px) {

  body {
    padding: 18px;
    align-items: flex-start;
  }

  .main-card {
    grid-template-columns: 1fr;
  }

  .result-panel {
    min-height: 360px;
  }
}

/* スマホ */

@media (max-width: 480px) {

  body {
    padding: 14px;
  }

  header {
    margin-bottom: 14px;
  }

  .logo {
    width: 42px;
    height: 42px;
    border-radius: 13px;
  }

  .brand-text h1 {
    font-size: 22px;
  }

  .main-card {
    padding: 12px;
    gap: 12px;
    border-radius: 24px;
  }

  .input-panel {
    padding: 10px 8px;
  }

  .result-panel {
    min-height: 330px;
    padding: 24px 15px;
    border-radius: 20px;
  }

  .rounding {
    grid-template-columns: repeat(2, 1fr);
  }

  .result-number {
    font-size: 65px;
  }

  .buttons {
    margin-top: 15px;
  }

  .sheet-body {
    padding: 22px 16px 24px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">

      <img class="logo" src="icon-192.png" alt="WARICANアイコン">

      <div class="brand-text">
        <h1>WARICAN</h1>
        <p>シンプル割り勘計算</p>
      </div>

    </div>
  </header>


  <main class="main-card">

    <!-- 入力パネル -->

    <section class="input-panel">

      <h2 class="section-title">
        金額と人数を入力
      </h2>


      <!-- 総額 -->

      <div class="field">

        <label for="total">
          総額
        </label>

        <div class="input-box">

          <input
            id="total"
            class="integer-input"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            value="0"
          >

          <span class="unit">
            円
          </span>

        </div>

      </div>


      <!-- レシート撮影・OCR -->

      <input
        type="file"
        id="receiptInput"
        accept="image/*"
        capture="environment"
      >

      <button
        class="ocr-button"
        id="ocrButton"
        type="button"
      >
        📷 レシートを撮影して自動入力
      </button>

      <div
        class="ocr-status"
        id="ocrStatus"
      ></div>


      <!-- 人数 -->

      <div class="field">

        <label for="people">
          参加人数
        </label>

        <div class="input-box">

          <input
            id="people"
            class="integer-input"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            value="2"
          >

          <span class="unit">
            人
          </span>

        </div>

      </div>


      <!-- 端数 -->

      <div class="field">

        <label>
          1人あたりの端数を切り上げ
        </label>

        <div class="rounding">

          <div>
            <input
              type="radio"
              name="rounding"
              id="r0"
              value="1"
              checked
            >

            <label for="r0">
              そのまま
            </label>
          </div>


          <div>
            <input
              type="radio"
              name="rounding"
              id="r100"
              value="100"
            >

            <label for="r100">
              100円
            </label>
          </div>


          <div>
            <input
              type="radio"
              name="rounding"
              id="r500"
              value="500"
            >

            <label for="r500">
              500円
            </label>
          </div>


          <div>
            <input
              type="radio"
              name="rounding"
              id="r1000"
              value="1000"
            >

            <label for="r1000">
              1000円
            </label>
          </div>

        </div>

      </div>


      <!-- ボタン -->

      <div class="buttons">

        <button
          class="reset"
          id="resetButton"
          type="button"
        >
          ↺ リセット
        </button>

        <button
          class="copy"
          id="copyButton"
          type="button"
        >
          ⧉ 結果をコピー
        </button>

      </div>

    </section>


    <!-- 結果 -->

    <section class="result-panel">

      <div class="result-label">
        1人あたり
      </div>

      <div class="result-number">

        <span id="result">
          2,500
        </span>

        <span class="yen">
          円
        </span>

      </div>

      <div class="result-info">

        総額
        <strong id="totalText">
          10,000円
        </strong>

        ／

        <strong id="peopleText">
          4人
        </strong>

      </div>

      <div
        class="difference"
        id="difference"
      >
        集金合計 10,000円
      </div>

      <!-- OCRに成功したレシート画像と計算結果を共有する -->
      <button
        class="share"
        id="shareButton"
        type="button"
        disabled
      >
        ↗ レシート画像付きで共有
      </button>

    </section>

  </main>


  <!-- OCR候補を確認する画面 -->
  <section
    class="sheet"
    id="ocrConfirmSheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ocrConfirmTitle"
  >
    <div class="sheet-body">

      <h2 id="ocrConfirmTitle">
        読み取り結果を確認
      </h2>

      <button
        class="receipt-preview ocr-confirm-preview"
        id="ocrConfirmPreviewButton"
        type="button"
        aria-label="レシート画像を拡大して確認"
      >
        <img
          id="ocrConfirmPreviewImage"
          alt="OCRで使用したレシート画像"
        >
      </button>

      <p class="ocr-confirm-label">
        合計金額の候補
      </p>

      <p
        class="ocr-confirm-amount"
        id="ocrConfirmAmount"
      ></p>

      <p class="ocr-confirm-notice">
        レシートを見て、合計金額が正しいか確認してください。
      </p>

      <div class="sheet-actions">
        <button
          class="close-sheet"
          id="ocrConfirmManualButton"
          type="button"
        >
          手入力する
        </button>

        <button
          class="open-share"
          id="ocrConfirmUseButton"
          type="button"
        >
          この金額を使う
        </button>
      </div>

    </div>
  </section>


  <!-- 共有前の確認画面 -->
  <section
    class="sheet"
    id="shareSheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="shareSheetTitle"
  >
    <div class="sheet-body">

      <h2 id="shareSheetTitle">
        共有する内容
      </h2>

      <!-- OCRで使用した元のレシート画像を縮小表示する -->
      <button
        class="receipt-preview"
        id="receiptPreviewButton"
        type="button"
        aria-label="共有画像を拡大して確認"
        hidden
      >
        <img
          id="receiptPreviewImage"
          alt="共有画像のプレビュー"
        >
      </button>

      <div class="share-notice">
        レシート画像には店名・日時などが写る場合があります。内容を確認してから共有してください。
      </div>

      <div class="sheet-actions">
        <button
          class="close-sheet"
          id="closeSheetButton"
          type="button"
        >
          閉じる
        </button>

        <button
          class="open-share"
          id="openShareButton"
          type="button"
        >
          共有先を開く
        </button>
      </div>

      <p
        class="share-action-status"
        id="shareActionStatus"
        aria-live="polite"
      ></p>

    </div>
  </section>


  <!-- レシート画像を大きく確認する画面 -->
  <section
    class="image-lightbox"
    id="imageLightbox"
    role="dialog"
    aria-modal="true"
    aria-label="共有画像の拡大表示"
  >
    <button
      class="lightbox-close"
      id="lightboxClose"
      type="button"
    >
      閉じる
    </button>

    <img
      id="receiptLargeImage"
      alt="共有画像の拡大表示"
    >
  </section>


  <footer>
    ブラウザだけで動作するシンプル割り勘計算ツール
    <div class="app-version">
      Version 1.0
    </div>
  </footer>

</div>


<script>

/* ==================================================
   基本設定
================================================== */

const totalInput =
  document.getElementById("total");

const peopleInput =
  document.getElementById("people");

const resultElement =
  document.getElementById("result");

const totalText =
  document.getElementById("totalText");

const peopleText =
  document.getElementById("peopleText");

const differenceElement =
  document.getElementById("difference");

const resetButton =
  document.getElementById("resetButton");

const copyButton =
  document.getElementById("copyButton");

const shareButton =
  document.getElementById("shareButton");

const ocrConfirmSheet =
  document.getElementById("ocrConfirmSheet");

const ocrConfirmPreviewButton =
  document.getElementById("ocrConfirmPreviewButton");

const ocrConfirmPreviewImage =
  document.getElementById("ocrConfirmPreviewImage");

const ocrConfirmAmount =
  document.getElementById("ocrConfirmAmount");

const ocrConfirmUseButton =
  document.getElementById("ocrConfirmUseButton");

const ocrConfirmManualButton =
  document.getElementById("ocrConfirmManualButton");

const shareSheet =
  document.getElementById("shareSheet");

const receiptPreviewButton =
  document.getElementById("receiptPreviewButton");

const receiptPreviewImage =
  document.getElementById("receiptPreviewImage");

const closeSheetButton =
  document.getElementById("closeSheetButton");

const openShareButton =
  document.getElementById("openShareButton");

const shareActionStatus =
  document.getElementById("shareActionStatus");

const imageLightbox =
  document.getElementById("imageLightbox");

const receiptLargeImage =
  document.getElementById("receiptLargeImage");

const lightboxClose =
  document.getElementById("lightboxClose");

/* OCRに成功した元画像を、このページを開いている間だけ保持する */
let receiptFileForShare = null;
let shareImageFile = null;
let shareImageUrl = null;
let receiptFileForConfirm = null;
let confirmCandidateAmount = null;
let confirmReceiptUrl = null;

const roundingInputs =
  document.querySelectorAll(
    'input[name="rounding"]'
  );


/* ==================================================
   数字表示
================================================== */

function formatNumber(number) {

  return Math.round(number)
    .toLocaleString("ja-JP");

}


/* ==================================================
   割り勘計算
================================================== */

function calculate() {

  const total =
    Number(totalInput.value) || 0;

  const people =
    Math.max(
      Number(peopleInput.value) || 1,
      1
    );

  const checkedRounding =
    document.querySelector(
      'input[name="rounding"]:checked'
    );

  const rounding =
    checkedRounding
      ? Number(checkedRounding.value)
      : 1;

  const rawAmount =
    total / people;

  let amount;


  /*
   * 「そのまま」
   *
   * 1円単位で四捨五入
   */

  if (rounding === 1) {

    amount =
      Math.round(rawAmount);

  } else {

    amount =
      Math.ceil(
        rawAmount / rounding
      ) * rounding;

  }


  const collected =
    amount * people;

  const difference =
    collected - total;


  resultElement.textContent =
    formatNumber(amount);

  totalText.textContent =
    formatNumber(total) + "円";

  peopleText.textContent =
    people + "人";


  if (difference > 0) {

    differenceElement.textContent =
      "集金合計 " +
      formatNumber(collected) +
      "円 ／ 余り " +
      formatNumber(difference) +
      "円";

  } else {

    differenceElement.textContent =
      "集金合計 " +
      formatNumber(collected) +
      "円";

  }

}


/* ==================================================
   整数入力の検査
   ・キーボード入力と貼り付けを数字だけに制限
   ・人数は入力途中だけ空欄を許可
================================================== */

function blockNonDigitInput(event) {

  if (
    event.inputType &&
    event.inputType.startsWith("delete")
  ) {
    return;
  }

  if (
    typeof event.data === "string" &&
    !/^\d+$/.test(event.data)
  ) {
    event.preventDefault();
  }

}


function sanitizeIntegerInput(input, minimum) {

  if (!/^\d*$/.test(input.value)) {
    input.value = "";
    return;
  }

  if (
    minimum === 1 &&
    input.value !== ""
  ) {
    input.value =
      input.value.replace(/^0+/, "");
  }

  if (
    minimum === 0
  ) {
    input.value =
      input.value.replace(/^0+(?=\d)/, "");
  }

}


function validateInputsForAction() {

  if (!/^[1-9]\d*$/.test(totalInput.value)) {
    alert(
      "合計金額を1円以上の整数で入力してください。"
    );
    totalInput.focus();
    return false;
  }

  if (!/^[1-9]\d*$/.test(peopleInput.value)) {
    alert(
      "人数を1人以上の整数で入力してください。"
    );
    peopleInput.focus();
    return false;
  }

  return true;

}


function addIntegerInputValidation(input, minimum) {

  input.addEventListener(
    "beforeinput",
    blockNonDigitInput
  );

  input.addEventListener(
    "input",
    () => {
      sanitizeIntegerInput(input, minimum);
      calculate();
    }
  );

  input.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        event.preventDefault();
        input.blur();
      }

    }
  );

}

function loadReceiptImage(file) {

  return new Promise((resolve, reject) => {

    const sourceUrl =
      URL.createObjectURL(file);

    const image =
      new Image();


    image.onload = () => {

      resolve({ image, sourceUrl });

    };


    image.onerror = () => {

      URL.revokeObjectURL(sourceUrl);
      reject(
        new Error("レシート画像を読み込めませんでした。")
      );

    };


    image.src = sourceUrl;

  });

}


function drawRoundedRect(context, x, y, width, height, radius) {

  const rounded =
    Math.min(radius, width / 2, height / 2);


  context.beginPath();
  context.moveTo(x + rounded, y);
  context.arcTo(x + width, y, x + width, y + height, rounded);
  context.arcTo(x + width, y + height, x, y + height, rounded);
  context.arcTo(x, y + height, x, y, rounded);
  context.arcTo(x, y, x + width, y, rounded);
  context.closePath();

}


async function createShareImageFile() {

  const { image, sourceUrl } =
    await loadReceiptImage(receiptFileForShare);


  try {

    const width = 1080;
    const padding = 52;
    const receiptMaxWidth = width - padding * 2 - 44;
    const receiptMaxHeight = 980;
    const receiptScale = Math.min(
      receiptMaxWidth / image.naturalWidth,
      receiptMaxHeight / image.naturalHeight,
      1
    );
    const receiptWidth =
      Math.round(image.naturalWidth * receiptScale);
    const receiptHeight =
      Math.round(image.naturalHeight * receiptScale);
    const receiptBoxHeight =
      receiptHeight + 52;
    const height =
      180 + 310 + 98 + 54 + receiptBoxHeight + 92;
    const canvas =
      document.createElement("canvas");


    canvas.width = width;
    canvas.height = height;


    const context =
      canvas.getContext("2d");

    const total =
      Number(totalInput.value) || 0;
    const people =
      Number(peopleInput.value) || 1;
    const amount =
      resultElement.textContent;


    context.fillStyle = "#ffffff";
    context.fillRect(0, 0, width, height);

    const headerGradient =
      context.createLinearGradient(0, 0, width, 180);

    headerGradient.addColorStop(0, "#0ea5e9");
    headerGradient.addColorStop(1, "#4f46e5");
    context.fillStyle = headerGradient;
    context.fillRect(0, 0, width, 180);

    context.fillStyle = "#ffffff";
    context.font = "800 38px sans-serif";
    context.textAlign = "center";
    context.fillText("WARICAN", width / 2, 105);

    drawRoundedRect(context, padding, 220, width - padding * 2, 270, 32);
    context.fillStyle = "#effaff";
    context.fill();

    context.fillStyle = "#0f355d";
    context.font = "700 34px sans-serif";
    context.fillText("1人あたり", width / 2, 292);
    context.font = "800 112px sans-serif";
    context.fillText(`${amount}円`, width / 2, 418);

    context.fillStyle = "#3c5772";
    context.font = "700 34px sans-serif";
    context.fillText(
      `合計 ${formatNumber(total)}円 ／ ${people}人`,
      width / 2,
      560
    );

    context.fillStyle = "#52677e";
    context.font = "700 28px sans-serif";
    context.fillText("レシート", width / 2, 624);

    const receiptBoxY = 654;
    const receiptBoxX = padding;
    const receiptBoxWidth = width - padding * 2;

    drawRoundedRect(
      context,
      receiptBoxX,
      receiptBoxY,
      receiptBoxWidth,
      receiptBoxHeight,
      26
    );
    context.fillStyle = "#f4f8fc";
    context.fill();

    const receiptX =
      (width - receiptWidth) / 2;
    const receiptY =
      receiptBoxY + 26;

    context.drawImage(
      image,
      receiptX,
      receiptY,
      receiptWidth,
      receiptHeight
    );

    context.fillStyle = "#7a5b15";
    context.font = "500 22px sans-serif";
    context.fillText(
      "レシートには店名・日時などが写る場合があります。",
      width / 2,
      height - 34
    );


    const blob =
      await new Promise(resolve => {

        canvas.toBlob(resolve, "image/png");

      });


    if (!blob) {

      throw new Error("共有画像を作成できませんでした。");

    }


    return new File(
      [blob],
      "warican-share.png",
      { type: "image/png" }
    );

  } finally {

    URL.revokeObjectURL(sourceUrl);

  }

}

/* ==================================================
   レシートOCR 改良版
   ・画像を拡大＋補正
   ・通常画像 / 強調画像 / 白黒画像をOCR
   ・合計系キーワードを強く評価
   ・小計 / 税 / お釣り / 預り金などを除外
   ・レシート下部の金額を優先
   ・複数回OCRで一致した金額を加点
   ・確認画面なしで自動入力
================================================== */

const receiptInput =
  document.getElementById("receiptInput");

const ocrButton =
  document.getElementById("ocrButton");

const ocrStatus =
  document.getElementById("ocrStatus");

let ocrWorker = null;


/* ==================================================
   ステータス
================================================== */

function showOCRStatus(
  message,
  type = ""
) {

  ocrStatus.textContent =
    message;

  ocrStatus.className =
    "ocr-status show " +
    type;

}

/* ==================================================
   レシート撮影
================================================== */

receiptInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if (!file) {
      return;
    }


    /* OCRに失敗した場合に古いレシートを共有しないよう、先に共有状態を解除する */
    clearReceiptForShare();
    clearOCRConfirm();


    try {

      ocrButton.disabled =
        true;


      showOCRStatus(
        "📷 レシート画像を準備しています…"
      );


      /*
       * OCRエンジンを初回だけ作成
       */

      if (!ocrWorker) {

        showOCRStatus(
          "🔧 OCRエンジンを準備しています…"
        );


        ocrWorker =
          await Tesseract.createWorker(
            ["jpn", "eng"],
            1,
            {

              logger:
                message => {

                  if (
                    message.status &&
                    typeof message.progress ===
                    "number"
                  ) {

                    const percent =
                      Math.round(
                        message.progress * 100
                      );


                    showOCRStatus(
                      "🔍 OCR解析中… " +
                      percent +
                      "%"
                    );

                  }

                }

            }
          );

      }


      /*
       * レシート画像を
       * 複数パターンに加工
       */

      const variants =
        await createReceiptImageVariants(
          file
        );


      const allResults =
        await recognizeReceiptVariants(
          variants,
          "レシートを解析しています…"
        );


      console.log(
        "OCR結果:",
        allResults
      );


      /*
       * 全OCR結果から
       * 合計金額を判定
       */

      const candidates =
        findBestReceiptAmounts(
          allResults
        );


      console.log(
        "金額候補:",
        candidates
      );


      const safetyDecision =
        evaluateReceiptAmountSafety(
          candidates
        );


      /*
       * 金額が見つからない
       */

      if (
        safetyDecision.kind ===
        "MANUAL"
      ) {

        showOCRStatus(
          "⚠ 合計金額を確定できませんでした。レシートを確認して、総額を入力してください。",
          "error"
        );
        totalInput.focus();
        totalInput.select();

        return;

      }


      if (
        safetyDecision.kind ===
        "CONFIRM"
      ) {

        showOCRConfirm(
          safetyDecision.candidate,
          file
        );

        showOCRStatus(
          "⚠ 読み取った候補は " +
          formatNumber(
            safetyDecision.candidate.amount
          ) +
          "円です。内容を確認してください。",
          "error"
        );

        console.log(
          "OCR安全判定: CONFIRM",
          safetyDecision
        );

        return;

      }


      /*
       * ★ 確認画面なし
       *
       * 最有力候補を自動採用
       */

      const detectedAmount =
        safetyDecision.candidate.amount;


      /*
       * 総額へ自動入力
       */

      totalInput.value =
        detectedAmount;


      /*
       * 自動計算
       */

      calculate();


      /* OCRに使った元画像を、共有時だけ使えるよう一時保持する */
      setReceiptForShare(file);


      /*
       * 完了
       */

      showOCRStatus(
        "✓ 合計 " +
        formatNumber(
          detectedAmount
        ) +
        "円を自動入力しました",
        "success"
      );


    } catch (error) {

      console.error(
        "OCR Error:",
        error
      );


      showOCRStatus(
        "⚠ OCRでエラーが発生しました。もう一度撮影してください。",
        "error"
      );


    } finally {

      ocrButton.disabled =
        false;


      /*
       * 同じ画像をもう一度
       * 選択できるようにする
       */

      receiptInput.value =
        "";

    }

  }
);


/* ==================================================
   画像をOCR用に加工
================================================== */

async function createReceiptImageVariants(
  file
) {

  const image =
    await loadImage(file);


  /*
   * 大きすぎる画像は1800px程度に縮小
   * 小さい画像は拡大
   */

  const maxWidth =
    1800;


  const scale =
    Math.min(
      2,
      maxWidth /
        image.naturalWidth
    );


  let width =
    Math.max(
      900,
      Math.round(
        image.naturalWidth *
        scale
      )
    );


  let height =
    Math.round(
      image.naturalHeight *
      (
        width /
        image.naturalWidth
      )
    );


  /*
   * 元画像
   */

  let source =
    document.createElement(
      "canvas"
    );


  source.width =
    width;

  source.height =
    height;


  const sourceContext =
    source.getContext(
      "2d",
      {
        willReadFrequently:
          true
      }
    );


  sourceContext.imageSmoothingEnabled =
    true;

  sourceContext.imageSmoothingQuality =
    "high";


  sourceContext.drawImage(
    image,
    0,
    0,
    width,
    height
  );


  /*
   * ① 元画像を高解像度化
   */

  const original =
    document.createElement(
      "canvas"
    );


  original.width =
    width;

  original.height =
    height;


  original
    .getContext("2d")
    .drawImage(
      source,
      0,
      0
    );


  /*
   * ② グレースケール＋コントラスト強調
   */

  const enhanced =
    document.createElement(
      "canvas"
    );


  enhanced.width =
    width;

  enhanced.height =
    height;


  const enhancedContext =
    enhanced.getContext(
      "2d",
      {
        willReadFrequently:
          true
      }
    );


  enhancedContext.drawImage(
    source,
    0,
    0
  );


  const imageData =
    enhancedContext.getImageData(
      0,
      0,
      width,
      height
    );


  const data =
    imageData.data;


  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const r =
      data[i];

    const g =
      data[i + 1];

    const b =
      data[i + 2];


    let gray =
      0.299 * r +
      0.587 * g +
      0.114 * b;


    /*
     * コントラスト強調
     */

    gray =
      (
        (gray - 128) *
        1.35
      ) + 128;


    gray =
      Math.max(
        0,
        Math.min(
          255,
          gray
        )
      );


    data[i] =
      gray;

    data[i + 1] =
      gray;

    data[i + 2] =
      gray;

  }


  enhancedContext.putImageData(
    imageData,
    0,
    0
  );


  /*
   * ③ 白黒画像
   */

  const binary =
    document.createElement(
      "canvas"
    );


  binary.width =
    width;

  binary.height =
    height;


  const binaryContext =
    binary.getContext(
      "2d",
      {
        willReadFrequently:
          true
      }
    );


  binaryContext.drawImage(
    enhanced,
    0,
    0
  );


  const binaryData =
    binaryContext.getImageData(
      0,
      0,
      width,
      height
    );


  const pixels =
    binaryData.data;


  const threshold =
    calculateOtsuThreshold(
      pixels
    );


  for (
    let i = 0;
    i < pixels.length;
    i += 4
  ) {

    const gray =
      pixels[i];


    const value =
      gray > threshold
        ? 255
        : 0;


    pixels[i] =
      value;

    pixels[i + 1] =
      value;

    pixels[i + 2] =
      value;

  }


  binaryContext.putImageData(
    binaryData,
    0,
    0
  );


  return [
    original,
    enhanced,
    binary
  ];

}


/* ==================================================
   OCR画像バリアントを解析
================================================== */

async function recognizeReceiptVariants(
  variants,
  phaseLabel
) {

  const results =
    [];

  for (
    let i = 0;
    i < variants.length;
    i++
  ) {

    showOCRStatus(
      "\ud83d\udd0d " +
      phaseLabel +
      " " +
      (i + 1) +
      "/" +
      variants.length
    );

    await ocrWorker.setParameters({

      tessedit_pageseg_mode:
        i === 0
          ? "6"
          : "11",

      preserve_interword_spaces:
        "1"

    });

    const result =
      await ocrWorker.recognize(
        variants[i]
      );

    results.push({

      variant:
        i,

      text:
        result.data.text || "",

      confidence:
        Number(
          result.data.confidence
        ) || 0,

    });

  }

  return results;

}


/* ==================================================
   画像読み込み
================================================== */

function loadImage(
  file
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const url =
        URL.createObjectURL(
          file
        );


      const image =
        new Image();


      image.onload =
        () => {

          URL.revokeObjectURL(
            url
          );


          resolve(
            image
          );

        };


      image.onerror =
        () => {

          URL.revokeObjectURL(
            url
          );


          reject(
            new Error(
              "画像を読み込めませんでした"
            )
          );

        };


      image.src =
        url;

    }
  );

}


/* ==================================================
   白黒化の閾値を自動計算
================================================== */

function calculateOtsuThreshold(
  data
) {

  const histogram =
    new Array(256)
      .fill(0);


  let total =
    0;

  let sum =
    0;


  /*
   * 全画素ではなく
   * 一定間隔で計算
   */

  for (
    let i = 0;
    i < data.length;
    i += 16
  ) {

    const value =
      data[i];


    histogram[value]++;

    total++;

    sum +=
      value;

  }


  let sumBackground =
    0;

  let weightBackground =
    0;

  let maxVariance =
    0;

  let threshold =
    180;


  for (
    let t = 0;
    t < 256;
    t++
  ) {

    weightBackground +=
      histogram[t];


    if (
      weightBackground ===
      0
    ) {
      continue;
    }


    const weightForeground =
      total -
      weightBackground;


    if (
      weightForeground ===
      0
    ) {
      break;
    }


    sumBackground +=
      t *
      histogram[t];


    const meanBackground =
      sumBackground /
      weightBackground;


    const meanForeground =
      (
        sum -
        sumBackground
      ) /
      weightForeground;


    const variance =
      weightBackground *
      weightForeground *
      Math.pow(
        meanBackground -
        meanForeground,
        2
      );


    if (
      variance >
      maxVariance
    ) {

      maxVariance =
        variance;

      threshold =
        t;

    }

  }


  return Math.max(
    120,
    Math.min(
      210,
      threshold
    )
  );

}


/* ==================================================
   合計金額を判定
================================================== */

function findBestReceiptAmounts(
  results
) {

  const candidates = [];

  const priorityKeywords = [
    "総合計", "税込合計", "お買上合計", "お買い上げ合計",
    "合計", "ご請求額", "請求額", "お会計", "お支払",
    "お支払い", "お買上", "お買い上げ", "TOTAL", "AMOUNT",
    "GRAND TOTAL", "BALANCE DUE"
  ];

  const excludedKeywords = [
    "お釣", "おつり", "釣銭", "預り", "お預り"
  ];

  const negativeKeywords = [
    "小計", "消費税", "内税", "外税", "税額", "値引", "割引",
    "クーポン", "ポイント", "SUBTOTAL", "CHANGE", "CASH"
  ];

  results.forEach((result, resultIndex) => {
    const lines = normalizeOCRText(result.text)
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(Boolean);

    lines.forEach((line, lineIndex) => {
      const amounts = extractAmountsFromLine(line);
      const priority = hasAnyKeyword(line, priorityKeywords);
      const taxIncludedTotal = /税込\s*合計|税\s*込\s*合計/.test(line);
      const standaloneTax = /(^|\s)税(\s|[:：]|$)/.test(line);
      const negative = hasAnyKeyword(line, negativeKeywords) ||
        (standaloneTax && !taxIncludedTotal);

      amounts.forEach(amount => {
        const excluded =
          isAmountLinkedToExcludedKeyword(
            line,
            amount,
            excludedKeywords
          );

        if (!isReasonableReceiptAmount(amount)) {
          console.log("OCR金額候補: 除外", { amount, line, reason: "金額の範囲外" });
          return;
        }

        if (excluded) {
          console.log("OCR金額候補: 除外", { amount, line, reason: "お預り・お釣り・釣銭" });
          return;
        }

        const reasons = [];
        let score = result.confidence * 0.25;

        if (priority) {
          score += 180;
          reasons.push(taxIncludedTotal ? "税込合計" : "合計系キーワード");
        }

        if (negative) {
          score -= 160;
          reasons.push("小計・税・値引など");
        }

        if (amount < 1000 && !priority) {
          score -= 70;
          reasons.push("合計表示のない3桁金額");
        }

        const position = lines.length <= 1 ? 1 : lineIndex / (lines.length - 1);
        score += position * 45;

        if (/[¥￥円]/.test(line)) score += 10;
        if (amount >= 1000) score += 8;
        if (amount >= 10000) score += 5;
        score += Math.max(0, 8 - resultIndex * 2);

        console.log("OCR金額候補: 採用候補", {
          amount,
          line,
          score,
          reasons: reasons.length > 0 ? reasons : ["通常候補"]
        });

        candidates.push({
          amount,
          score,
          line,
          confidence: result.confidence,
          priority: priority && !negative,
          negative,
          excluded
        });
      });
    });
  });

  const grouped = new Map();

  candidates.forEach(candidate => {
    const current = grouped.get(candidate.amount);

    if (!current) {
      grouped.set(candidate.amount, {
        amount: candidate.amount,
        score: candidate.score,
        hits: 1,
        lines: [candidate.line],
        priorityHits: candidate.priority ? 1 : 0,
        negativeHits: candidate.negative ? 1 : 0,
        excludedHits: candidate.excluded ? 1 : 0,
        confidenceTotal: candidate.confidence
      });
      return;
    }

    current.hits++;
    current.score += candidate.score * 0.35;
    current.lines.push(candidate.line);
    current.priorityHits += candidate.priority ? 1 : 0;
    current.negativeHits += candidate.negative ? 1 : 0;
    current.excludedHits += candidate.excluded ? 1 : 0;
    current.confidenceTotal += candidate.confidence;
  });

  return Array.from(grouped.values())
    .map(candidate => ({
      ...candidate,
      score: candidate.score + Math.min(candidate.hits * 12, 36)
    }))
    .sort((a, b) => b.score !== a.score ? b.score - a.score : b.amount - a.amount)
    .slice(0, 8);

}


/* ==================================================
   OCR自動入力の安全判定
================================================== */

function evaluateReceiptAmountSafety(
  candidates
) {

  const top =
    candidates[0];

  if (!top) {
    return {
      kind: "MANUAL",
      reason: "候補なし"
    };
  }

  const second =
    candidates[1];

  const scoreGap =
    second
      ? top.score - second.score
      : top.score;

  const averageConfidence =
    top.confidenceTotal /
    top.hits;

  const isSafe =
    top.amount >= 1000 &&
    top.hits >= 2 &&
    top.priorityHits >= 2 &&
    top.negativeHits === 0 &&
    top.excludedHits === 0 &&
    scoreGap >= 100 &&
    averageConfidence >= 50;

  return {
    kind: isSafe ? "AUTO" : "CONFIRM",
    candidate: top,
    reason: {
      hits: top.hits,
      priorityHits: top.priorityHits,
      negativeHits: top.negativeHits,
      excludedHits: top.excludedHits,
      scoreGap: Math.round(scoreGap),
      averageConfidence: Math.round(averageConfidence)
    }
  };

}

/* ==================================================
   OCR文字の正規化
================================================== */

function normalizeOCRText(
  text
) {

  return String(
    text || ""
  )

    .normalize(
      "NFKC"
    )

    .replace(
      /[\u3000]/g,
      " "
    )

    .replace(
      /合\s*計/g,
      "合計"
    )

    .replace(
      /お\s*支\s*払/g,
      "お支払"
    )

    .replace(
      /小\s*計/g,
      "小計"
    )

    .replace(
      /T\s*O\s*T\s*A\s*L/gi,
      "TOTAL"
    );

}


/* ==================================================
   キーワード検索
================================================== */

function isAmountLinkedToExcludedKeyword(
  line,
  amount,
  keywords
) {

  const amountPattern =
    String(amount)
      .split("")
      .join("[,\\.\\s]*");

  const keywordPattern =
    keywords
      .map(
        keyword =>
          keyword.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
          )
      )
      .join("|");

  const excludedAmountPattern =
    new RegExp(
      "(?:" +
      keywordPattern +
      ")[^0-9]{0,12}" +
      amountPattern +
      "(?!\\d)",
      "i"
    );

  return excludedAmountPattern.test(line);

}


function hasAnyKeyword(
  text,
  keywords
) {

  return keywords.some(
    keyword =>
      text
        .toLowerCase()
        .includes(
          keyword.toLowerCase()
        )
  );

}


/* ==================================================
   金額抽出
================================================== */

function extractAmountsFromLine(
  line
) {

  /*
   * OCRで間違いやすい
   * O / o → 0
   * I / l / | → 1
   * S → 5
   * B → 8
   */

  const normalized =
    line

      .replace(
        /[Oo]/g,
        "0"
      )

      .replace(
        /[Il|]/g,
        "1"
      )

      .replace(
        /[Ｓｓ]/g,
        "5"
      )

      .replace(
        /[Ｂｂ]/g,
        "8"
      );


  const matches =
    normalized.match(
      /(?:[¥￥]\s*)?(?:\d{1,3}(?:[,.]\d{3})+|\d{1,3}(?:\s\d{3})+|\d{3,7})\s*(?:円|¥|￥)?/g
    );


  if (!matches) {
    return [];
  }


  return matches

    .map(
      value => {

        const cleaned =
          value.replace(
            /[^0-9]/g,
            ""
          );


        return Number(
          cleaned
        );

      }
    )

    .filter(
      Number.isFinite
    );

}


/* ==================================================
   金額チェック
================================================== */

function isReasonableReceiptAmount(
  amount
) {

  return (
    amount >= 100 &&
    amount <= 1000000
  );

}
